[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Sitio sin compilación: listo.'"

[functions]
  node_bundler = "esbuild"

# Los QR antiguos con ?p=palabra los redirige la función de páginas.

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"

# Panel: solo código propio, micrófono permitido solo aquí, nunca dentro de otro sitio.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
